name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  samples:
    # The sample apps built for the web in the pinned SDK image (.github/sdk/Dockerfile), for JavaScript
    # (CanvasKit) and for WebAssembly (skwasm, served with the cross-origin headers it needs): the whole
    # suite against them twice, and on JavaScript the assertions that must fail.
    name: flutter-steps on the sample apps (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [javascript, webassembly]
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      LAUNCH_URL: http://127.0.0.1:8080
      CUCUMBER_TAGS: ${{ matrix.target == 'webassembly' && 'not @wip and not @must-fail and not @javascript' || 'not @wip and not @must-fail and not @webassembly' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the sample apps (${{ matrix.target }})
        run: bash .github/scripts/build-samples.sh ${{ matrix.target == 'webassembly' && '--wasm' || '' }}

      - name: Serve the sample apps
        run: |
          if [ "${{ matrix.target }}" = webassembly ]; then
            nohup python3 -I .github/scripts/serve.py samples/site-wasm 8080 --isolated > serve.log 2>&1 &
          else
            nohup python3 -I .github/scripts/serve.py samples/site 8080 > serve.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            curl -sf "$LAUNCH_URL/counter/" > /dev/null && exit 0
            sleep 1
          done
          echo "The sample apps did not answer" >&2
          cat serve.log >&2
          exit 1

      - name: Run the test suite
        run: npx cucumber-js

      - name: Run the test suite again (it leaves the apps as it found them)
        run: npx cucumber-js

      - name: Run the assertions that must fail
        if: matrix.target == 'javascript'
        run: npm run test:must-fail

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.target }}
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.target }}
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
